# SwiftFormat owns whitespace; SwiftLint checks unsafe constructs and duplicate declarations.
only_rules:
  - force_cast
  - force_try
  - force_unwrapping
  - implicitly_unwrapped_optional
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicate_imports
  - weak_delegate
  - unowned_variable_capture
  - unavailable_function
included:
  - Package.swift
  - Sources
  - Tests
excluded:
  - .build
  - .swiftpm
  - upstream
